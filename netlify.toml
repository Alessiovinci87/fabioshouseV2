# Le Porte di Sardegna — config Netlify
# Le redirect SPA restano in `_redirects`; qui solo functions + sicurezza minima.

[build]
  publish = "."
  functions = "netlify/functions"
  # Prerender: HTML statico per ogni rotta della SPA (vedi tools/prerender.js)
  command = "node tools/prerender.js"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Forza Node moderno (fetch globale, AbortController).
  node_bundler = "esbuild"
